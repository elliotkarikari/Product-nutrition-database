    name: NIQ Brandbank content licensing
    publisher: NielsenIQ Brandbank
    url: https://nielseniq.com/global/en/products/content-licensing/
    kind: branded-products-licensed
    jurisdictions: [global, UK]
    authority: high-covered-gtins
    licence:
      name: Commercial licence, agreed use cases
      commercial_use: licence-required
      redistribution: licence-required
      attribution_required: false
    watch:
      method: terms-review-no-scraping
      cadence: quarterly
    status: partnership-route

  - id: gs1-uk-productdna
