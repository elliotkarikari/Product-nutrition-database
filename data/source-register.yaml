      name: Open Government Licence v3.0
      commercial_use: allowed
      redistribution: allowed
      attribution_required: true
    watch:
      method: file-hash-and-page-change
      cadence: monthly
    status: deferred
    note: "Deferred deliberately (2026-11-05): not snapshotted or imported. The CoFID 2021 user guide says these foods were not reviewed or validated in the 2015, 2019 or 2021 updates and their values may not represent the foods as currently consumed. Nothing in the build needs them yet, and importing them would place unreviewed values beside current ones. Revisit when a reported gap needs one; if imported, every observation is marked unreviewed."

