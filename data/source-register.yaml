  - id: usda-fooddata-central
    name: USDA FoodData Central
    publisher: USDA
    url: null
    kind: composition-dataset
    jurisdictions: [US]
    authority: highest-generic-us
    licence:
      name: Public domain
      commercial_use: allowed
      redistribution: allowed
      attribution_required: false
    watch:
