  - id: uk-food-portion-sizes-2002
    name: Food Portion Sizes, 3rd edition (Food Standards Agency, 2002)
    publisher: Food Standards Agency; published by TSO (ISBN 9780112429616)
    url: https://www.tsoshop.co.uk/product/9780112429616/Food-portion-sizes
    kind: portion-and-weight-evidence
    jurisdictions: [UK]
    authority: primary-reference-for-portions
    licence:
      name: Crown copyright; NOT covered by the Open Government Licence
      commercial_use: owner-decision
      redistribution: owner-decision
      attribution_required: true
      decision: "Food Portion Sizes (3rd edition, Food Standards Agency, published by TSO, 2002). Crown copyright. NOT covered by the Open Government Licence. Included in this public repository on Elliot Karikari's decision of November 5, 2026, with his reasoning: the weights are individual facts; the data was transcribed by hand from his own copy of the book; he accepts the compilation-rights question as his call. This is not a licence: FPS is never described as OGL or as licensed. The decision record travels with the data, and every FPS-derived value carries the book citation as its provenance."
    watch:
      method: static-reverify
      cadence: yearly
    status: import-pending-source-confirmation
    note: "Import source is the legacy file that is Elliot's hand transcription from his own copy; awaiting his confirmation of which file that is (docs/LEGACY_INVENTORY.md). The PDF-extracted FPS file is used only where it reconciles with the transcription; disagreements are reported, not averaged."

