<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShelfScale</title>
<meta name="description" content="The foods sold in the UK as they are sold: what they weigh, what is in them and where every number came from. Browse it, download it, and score a product with it.">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="mast">
  <a class="brand" href="#/" aria-label="ShelfScale home">
    <svg class="brand-mark" viewBox="0 0 40 24" aria-hidden="true"><path d="M2 2h16v6a4 4 0 0 0 0 8v6H2v-6a4 4 0 0 0 0-8zM22 2h16v6a4 4 0 0 0 0 8v6H22v-6a4 4 0 0 0 0-8z"/></svg>
    <span>ShelfScale</span>
  </a>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="browse">Browse the data</a>
    <a href="#/score" data-tab="score">Score a product</a>
    <a href="#/range" data-tab="range">Score your range</a>
    <a href="#/download" data-tab="download">Download the data</a>
  </nav>
</header>

<main id="main" tabindex="-1">
  <div id="view" aria-live="polite"></div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <section class="sheet-card ticket" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="btn btn-ghost sheet-close" type="button" data-close>Close</button>
    <div id="sheet-body"></div>
  </section>
</div>

<noscript><p class="noscript">ShelfScale needs JavaScript to run in your browser. The release files download without it: <a href="/download/release_manifest.json">release_manifest.json</a> lists them. The data API is described at <a href="/api">/api</a>.</p></noscript>
</body>
</html>
